[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointr"
version = "0.0.0"
description = "Pointr: sports training data from a live camera"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python>=5,<6"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jsonschema"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".jupyter_runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["services", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
