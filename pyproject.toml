[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointr"
version = "0.0.0"
description = "Pointr: sports training data from a live camera"
requires-python = ">=3.11"
# Exact pins: the perception APIs were verified against these versions (D-015, D-016).
# torch/torchvision: install the CPU or CUDA wheels first, from the matching PyTorch index
# (README, Install on a new PC). The local label (+cpu, +cu126) is ignored by these pins.
dependencies = [
    "numpy>=2,<3",
    "opencv-python>=5,<6",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "rfdetr==1.11.2",
    "supervision==0.30.8",
    "trackers==2.6.1",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jsonschema"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".jupyter_runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["services", "fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: needs the real model weights and network on first run (pytest -m slow)"]
